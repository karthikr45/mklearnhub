{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "learnhub.fullname" . }}
  labels:
    {{- include "learnhub.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Order matters: most-specific prefixes first.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "learnhub.fullname" . }}-api
                port:
                  number: {{ .Values.service.ports.api }}
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "learnhub.fullname" . }}-admin
                port:
                  number: {{ .Values.service.ports.admin }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "learnhub.fullname" . }}-web
                port:
                  number: {{ .Values.service.ports.web }}
{{- end }}
